name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./expense-tracker/backend
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm install
      - name: Run Lint
        run: npm run lint
      - name: Run Tests
        run: npm test

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./expense-tracker/frontend
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      
      # Lệnh quan trọng để sửa lỗi Permission denied
      - name: Fix Permissions
        run: chmod -R +x node_modules/.bin
        
      - name: Run Lint
        run: npm run lint
      - name: Run Tests
        run: npm test
      - name: Build Source
        run: CI=false npm run build --if-present


  deploy:
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./expense-tracker/backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-backend:latest
      
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./expense-tracker/frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-frontend:latest
