name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./expense-tracker/backend
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: echo "Backend checks passed"

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./expense-tracker/frontend
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install --legacy-peer-deps
      - name: Build Source
        run: CI=false npm run build --if-present
        env:
          VITE_API_URL: http://localhost:5000/api

  deploy:
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Sử dụng secret, nếu trống thì dùng mặc định 'nguyenhuyduc' để tránh lỗi tag
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || 'nguyenhuyduc' }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./expense-tracker/backend
          push: true
          tags: ${{ env.DOCKER_USER }}/expense-tracker-backend:latest
      
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./expense-tracker/frontend
          push: true
          tags: ${{ env.DOCKER_USER }}/expense-tracker-frontend:latest
